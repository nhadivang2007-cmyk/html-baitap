<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Calculator - Trần Đức Hải</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f4f4f9;
        margin: 0;
      }
      .calculator-container {
        background-color: #e0e0e0;
        padding: 20px;
        border-radius: 8px;
        width: 320px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }
      .student-info {
        text-align: center;
        margin-bottom: 10px;
        color: #333;
      }
      .student-info h3 {
        margin: 0 0 10px 0;
        font-size: 15px;
      }
      .display {
        background-color: #dcdcdc;
        color: #000;
        font-size: 1.8rem;
        text-align: right;
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 15px;
        min-height: 60px;
        word-break: break-all;
        border: 1px solid #ccc;
      }
      .buttons-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .btn {
        padding: 15px 5px;
        font-size: 1.1rem;
        font-weight: bold;
        color: white;
        border: 1px solid #1b5e20;
        border-radius: 4px;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .buttons-grid .btn:nth-child(17),
      .buttons-grid .btn:nth-child(18) {
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      const Display = ({ value }) => (
        <div className="display">{value || "0"}</div>
      );

      const Button = ({ label, color, onClick }) => (
        <button
          className="btn"
          style={{ backgroundColor: color }}
          onClick={() => onClick(label)}
        >
          {label}
        </button>
      );

      function App() {
        const [expression, setExpression] = useState("0");

        const handleButtonClick = (value) => {
          if (value === "Clear" || value === "C") setExpression("0");
          else if (value === "Delete") {
            if (expression.length <= 1 || expression === "Lỗi")
              setExpression("0");
            else setExpression(expression.slice(0, -1));
          } else if (value === "=") {
            try {
              setExpression(String(eval(expression)));
            } catch (e) {
              setExpression("Lỗi");
            }
          } else {
            if (expression === "0" || expression === "Lỗi")
              setExpression(value);
            else setExpression(expression + value);
          }
        };

        const buttons = [
          { label: "Clear", color: "#4CAF50" },
          { label: "Delete", color: "#4CAF50" },
          { label: ".", color: "#4CAF50" },
          { label: "/", color: "#2E7D32" },
          { label: "7", color: "#4CAF50" },
          { label: "8", color: "#4CAF50" },
          { label: "9", color: "#4CAF50" },
          { label: "*", color: "#2E7D32" },
          { label: "4", color: "#4CAF50" },
          { label: "5", color: "#4CAF50" },
          { label: "6", color: "#4CAF50" },
          { label: "-", color: "#2E7D32" },
          { label: "1", color: "#4CAF50" },
          { label: "2", color: "#4CAF50" },
          { label: "3", color: "#4CAF50" },
          { label: "+", color: "#2E7D32" },
          { label: "0", color: "#4CAF50" },
          { label: "=", color: "#2E7D32" },
        ];

        return (
          <div className="calculator-container">
            <div className="student-info">
              <h3>Trần Đức Hải - B25DCTV035</h3>
            </div>
            <Display value={expression} />
            <div className="buttons-grid">
              {buttons.map((btn, i) => (
                <Button
                  key={i}
                  label={btn.label}
                  color={btn.color}
                  onClick={handleButtonClick}
                />
              ))}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
