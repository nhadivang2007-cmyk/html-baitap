<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Máy Tính Đơn Giản</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f4f4f9;
        margin: 0;
      }

      .calculator {
        background-color: #333;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        width: 300px;
      }

      #display {
        background-color: #222;
        color: #fff;
        font-size: 2rem;
        text-align: right;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 15px;
        min-height: 60px;
        word-wrap: break-word;
        word-break: break-all;
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      button {
        padding: 18px 10px;
        font-size: 1.2rem;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background-color: #e0e0e0;
        transition: background-color 0.2s, transform 0.05s;
      }

      button:hover {
        background-color: #d4d4d4;
      }

      button:active {
        transform: scale(0.96);
      }

      .operator {
        background-color: #ff9500;
        color: white;
      }

      .operator:hover {
        background-color: #e08500;
      }

      .clear {
        background-color: #ff3b30;
        color: white;
        grid-column: span 2;
      }

      .clear:hover {
        background-color: #d32f2f;
      }

      .equal {
        background-color: #34c759;
        color: white;
        /* Kéo dài nút = xuống hết 2 hàng để lấp đầy khung lưới */
        grid-row: span 2;
      }

      .equal:hover {
        background-color: #2e7d32;
      }

      .zero {
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <!-- Màn hình hiển thị -->
      <div id="display">0</div>

      <!-- Khung chứa nút -->
      <div class="buttons" id="btnContainer">
        <button class="clear" id="btnClear">Clear</button>
        <button class="operator" value="/">/</button>
        <button class="operator" value="*">*</button>

        <button class="btn-num" value="7">7</button>
        <button class="btn-num" value="8">8</button>
        <button class="btn-num" value="9">9</button>
        <button class="operator" value="-">-</button>

        <button class="btn-num" value="4">4</button>
        <button class="btn-num" value="5">5</button>
        <button class="btn-num" value="6">6</button>
        <button class="operator" value="+">+</button>

        <button class="btn-num" value="1">1</button>
        <button class="btn-num" value="2">2</button>
        <button class="btn-num" value="3">3</button>
        <button class="equal" id="btnEqual">=</button>

        <button class="btn-num zero" value="0">0</button>
        <button class="btn-num" value=".">.</button>
      </div>
    </div>

    <script>
      const display = document.getElementById("display");
      const btnContainer = document.getElementById("btnContainer");

      // Sử dụng Event Delegation để tối ưu hiệu năng
      btnContainer.addEventListener("click", function (e) {
        const target = e.target;
        if (!target.matches("button")) return;

        const value = target.innerText;
        const currentDisplay = display.innerText;
        const operators = ["+", "-", "*", "/"];
        const lastChar = currentDisplay.slice(-1);

        // Nút Clear
        if (target.id === "btnClear") {
          display.innerText = "0";
          return;
        }

        // Nút Tính Kết Quả (=)
        if (target.id === "btnEqual") {
          try {
            const result = eval(currentDisplay);
            if (!isFinite(result)) {
              display.innerText = "Lỗi chia 0";
            } else {
              // Làm tròn số thập phân quá dài (nếu có)
              display.innerText = Number.isInteger(result) ? result : parseFloat(result.toFixed(8));
            }
          } catch (error) {
            display.innerText = "Lỗi";
          }
          return;
        }

        // Xử lý khi màn hình đang hiển thị "0" hoặc trạng thái "Lỗi"
        if (currentDisplay === "0" || currentDisplay.includes("Lỗi")) {
          if (operators.includes(value)) {
            display.innerText = "0" + value; // Cho phép bắt đầu bằng số âm hoặc 0+...
          } else {
            display.innerText = value;
          }
          return;
        }

        // Chặn nhập 2 toán tử liên tiếp (vd: ++, */)
        if (operators.includes(value) && operators.includes(lastChar)) {
          display.innerText = currentDisplay.slice(0, -1) + value;
          return;
        }

        display.innerText += value;
      });
    </script>
  </body>
</html>
